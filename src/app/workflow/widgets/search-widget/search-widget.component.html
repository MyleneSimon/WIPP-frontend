<div class="widget form-group">
  <label [for]="id" class="horizontal control-label">
    {{ schema.title }}
  </label>
  <p-autoComplete
    [suggestions]="data"
    (completeMethod)="filter($event)"
    [placeholder]="schema.placeholder"
    [name]="name" [formControl]="control"
    [inputId]="id"
    optionLabel="name" />
</div>
