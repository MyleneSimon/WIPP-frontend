<p-panel>
  <div #chatContainer class="chat-container" style="max-height: 500px; overflow-y: auto; padding: 10px;">
    <div style="margin-top: 10px"
         *ngFor="let message of messages"
         [style.textAlign]="message.sender === 'me' ? 'right' : 'left'">
      <span *ngIf="message.sender == 'me'"
        [ngClass]="{'p-2 surface-100 border-round message-me': message.sender === 'me'}">
        {{message.text}}
      </span>
      <span *ngIf="message.sender != 'me'">
        <span style="font-size: 0.8em; color: gray;">WIPP AI Assistant</span>
        <markdown [data]="message.text"></markdown>
      </span>

    </div>
  </div>
  <div style="padding: 10px;">
    <textarea pInputTextarea [(ngModel)]="newMessage" rows="3" style="width: 100%;" (keydown.enter)="sendMessage()">
    </textarea>
  </div>
</p-panel>
