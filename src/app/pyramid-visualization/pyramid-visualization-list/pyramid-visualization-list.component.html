<h1>Multichannel Visualizations</h1>
<div class="card">
  <p-table #dt
           [value]="visualizations"
           [lazy]="true"
           (onLazyLoad)="loadData($event)"
           dataKey="id"
           [tableStyle]="{ 'min-width': '75rem' }"
           [paginator]="true"
           [rows]="10"
           [rowsPerPageOptions]="[10, 25, 50]"
           [totalRecords]="resultsLength"
           selectionMode="single"
           [showCurrentPageReport]="true"
           currentPageReportTemplate="Showing {first} to {last} of {totalRecords} entries"
           [globalFilterFields]="['name']"
  >
    <ng-template #caption>
      <div class="flex align-items-center justify-content-between">
        <p-button
          *ngIf="canCreate()"
          label="New"
          icon="pi pi-plus"
          (click)="createNew()" />
        <p-iconfield iconPosition="left" class="ml-auto">
          <p-inputicon>
              <i class="pi pi-search"></i>
          </p-inputicon>
          <input
            pInputText
            type="text"
            (input)="dt.filterGlobal($event.target.value, 'contains')"
            placeholder="Search..." />
        </p-iconfield>
      </div>
    </ng-template>
    <ng-template #header>
      <tr>
        <th pSortableColumn="name">
          Name <p-sortIcon field="name" />
        </th>
        <th pSortableColumn="creationDate">
          Creation date <p-sortIcon field="creationDate" />
        </th>
        <th pSortableColumn="publiclyShared">
          Visibility <p-sortIcon field="publiclyShared" />
        </th>
        <th pSortableColumn="owner">
          Owner <p-sortIcon field="owner" />
        </th>
      </tr>
    </ng-template>
    <ng-template #body let-vis>
      <tr routerLink="/pyramid-visualizations/{{vis.id}}" class="p-selectable-row" [pSelectableRow]="vis">
        <td>{{ vis.name }}</td>
        <td>{{ vis.creationDate | date }}</td>
        <td><i [class]="vis.publiclyShared ? 'pi pi-globe' : 'pi pi-user'"></i></td>
        <td>{{ vis.owner }}</td>
      </tr>
    </ng-template>
  </p-table>
</div>
<p-toast position="top-center" [life]="5000"/>
