<form>
  <div class="flex flex-column gap-2">
    <label for="name" class="font-semibold w-6rem">Name</label>
    <input pInputText [(ngModel)]="iterativeTrainingPipeline.name" id="name" name="name" class="flex-auto" autocomplete="off" />
    <span class="p-text-secondary block mb-2">Enter the pipeline name.</span>
  </div>
  <div class="formgrid grid">
    <div class="field col">
      <label for="taskCategory" class="font-semibold">Task Category</label>
      <input pInputText [(ngModel)]="defaultTaskCategory" id="taskCategory" name="taskCategory"
             class="w-full mb-2" [disabled]="true" autocomplete="off" />
      <span class="p-text-secondary">Select the task category.</span>
    </div>
    <div class="field col">
      <label for="name" class="font-semibold">Workflow Template</label>
      <input pInputText [(ngModel)]="iterativeTrainingPipeline.workflowTemplate" id="workflowTemplate" name="workflowTemplate"
             class="w-full mb-2" [disabled]="true" autocomplete="off" />
      <span class="p-text-secondary">Select the workflow template.</span>
    </div>
  </div>
  <div class="p-fluid">
    <label for="trainingCollection" class="font-semibold">Training data collection<span style="color: #e32"> * </span>
      <span class="pi pi-question-circle" pTooltip="Collection to annotate"></span>
    </label>
    <p-autoComplete
      [(ngModel)]="iterativeTrainingPipeline.trainingCollection"
      [suggestions]="availableCollections"
      (completeMethod)="filterImgColl($event)"
      placeholder="Start typing name to select a collection..."
      optionValue="id"
      name="collections"
      field="name"
      class="m-2"/>
  </div>
  <div class="p-fluid">
    <label for="startGroundTruthCollection" class="font-semibold">Existing masks collection
      <span class="pi pi-question-circle"
            pTooltip="(Optional) Existing ground truth masks - will be imported as annotations for review at the first iteration">
      </span>
    </label>
    <p-autoComplete
      [(ngModel)]="iterativeTrainingPipeline.startGroundTruthCollection"
      [suggestions]="availableCollections"
      (completeMethod)="filterImgColl($event)"
      placeholder="Start typing name to select a collection..."
      optionValue="id"
      name="collections"
      field="name"
      class="m-2"/>
  </div>
  <div class="flex flex-column gap-2">
    <label for="imagesPerIteration" class="font-semibold">Images per iteration<span style="color: #e32"> * </span></label>
    <input pInputText [(ngModel)]="iterativeTrainingPipeline.imagesPerIteration" id="imagesPerIteration" name="imagesPerIteration" class="flex-auto" autocomplete="off" />
    <span class="p-text-secondary block mb-2">Number of images to annotate per iteration.</span>
  </div>
  <div  class="flex flex-column gap-2 mb-3">
    <label for="iterativeTrainingPipelineLabels" class="font-semibold">Labels<span style="color: #e32"> * </span></label>
    <p-button label="Add label" icon="pi pi-plus" severity="secondary" outlined="true" *ngIf="labelAddDisplay"
              (onClick)="labelAddDisplay = false"/>
    <div class="formgroup-inline gap-2" *ngIf="!labelAddDisplay">
      <p-inputGroup class="w-8">
        <input pInputText [(ngModel)]="labelName" id="labelName" name="labelName" autocomplete="off" placeholder="Label name"/>
        <p-inputGroupAddon>
          <p-colorPicker id="labelColor" name="labelColor"
                         [(ngModel)]="labelColor" pTooltip="Change label color"/>
        </p-inputGroupAddon>
        <input pInputText [(ngModel)]="labelColor" id="labelColorText" name="labelColor" autocomplete="off" style="width: 1rem;"/>
      </p-inputGroup>
      <p-button label="Cancel" severity="secondary" (onClick)="resetLabelForm()" />
      <p-button label="Save" (onClick)="addLabel()" [disabled]="!labelName || !labelColor" type="submit"/>
    </div>
    <div class="card flex align-items-center gap-2 flex-wrap">
      <p-chip *ngFor="let label of iterativeTrainingPipeline.labels;" [label]="label.name" [removable]="true" (onRemove)="removeLabel(label)"
              [style]="{'background-color': label.color}"/>
    </div>
  </div>
  <div class="flex justify-content-end gap-2">
    <p-button label="Cancel" severity="secondary" (onClick)="cancel()" />
    <p-button label="Save" (onClick)="create()" [disabled]="!iterativeTrainingPipeline.name" type="submit"/>
  </div>
  <div><span style="color: #e32"> * </span>Required fields</div>
</form>
<p-toast position="top-center"/>
