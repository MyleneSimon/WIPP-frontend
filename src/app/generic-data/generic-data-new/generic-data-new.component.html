<form>
  <div class="flex flex-column gap-2">
    <label for="name" class="font-semibold">Name</label>
    <input pInputText [(ngModel)]="genericData.name" id="name" name="name" class="flex-auto" autocomplete="off" />
    <span class="p-text-secondary block mb-5">Enter the Generic data collection name.</span>
    <label for="name" class="font-semibold">Type (optional)</label>
    <input pInputText [(ngModel)]="genericData.type" id="type" name="type" class="flex-auto" autocomplete="off" />
    <span class="p-text-secondary block mb-5">Enter the data type (e.g. VIDEO, OBJ, PDF, etc.).</span>
    <label for="name" class="font-semibold">Description (optional)</label>
    <textarea rows="5" cols="30" pInputTextarea [(ngModel)]="genericData.description" id="description" name="description">
    </textarea>
    <span class="p-text-secondary block mb-5">Enter a short description of the data.</span>
  </div>
  <div class="flex justify-content-end gap-2">
    <p-button label="Cancel" severity="secondary" (onClick)="cancel()" />
    <p-button label="Save" (onClick)="createCollection()" [disabled]="!genericData.name" type="submit"/>
  </div>
</form>
<p-toast position="top-center"/>
